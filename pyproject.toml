[project]
name = "cow_calculator_lib"
version = "0.1.0"
description = "A basic calculator library with cows"
readme = "README.md"
authors = [
    { name = "Person 1", email = "person1@email.com" },
    { name = "Person 2", email = "person2@email.com" },
    { name = "Person 3", email = "person3@email.com" },
]
requires-python = ">=3.12"
dependencies = ["cowsay"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [{ include-group = "test" }]
test = [
    "pytest>=9.0.2",
    "pytest-benchmark[histogram]>=5.2.3",
]
