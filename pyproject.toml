[project]
name = "testing-assignment-3"
version = "0.1.0"
description = "Selenium web tests for 31282 Systems Testing and Quality Management Assignment 3"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    { include-group = "test" },
    "selenium>=4.51.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-benchmark[histogram]>=5.2.3",
]

[tool.ruff]
line-length = 120
