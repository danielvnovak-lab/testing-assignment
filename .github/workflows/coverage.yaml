
name: coverage-badge

on:
  push:
    branches: [main]
    # No point rebuilding coverage if only documentation is changed
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: coverage-pages
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          lfs: true

      - uses: ./.github/actions/uv-setup

      - run: uv sync

      - name: Install packages to generate the coverage badge
        run: |
          uv pip install pytest pytest-cov "genbadge[coverage]"

      - name: Run tests + coverage
        run: >
          uv run pytest --cov=src/ 
          --cov-report=xml:coverage.xml 
          --cov-report=html:htmlcov 
          --cov-report=markdown

      - name: Generate badge
        run: |
          uv run genbadge coverage -i coverage.xml -o coverage-badge.svg
      
      # TODO - Automatically update the README with coverage badge link
      # - name: Update README coverage links
      #   run: |
      #     REPO="${GITHUB_REPOSITORY}"

      #     perl -0pi -e "
      #       s|https://github\.com/[^/]+/[^/]+/blob/gh-pages/coverage/coverage-badge\.svg|https://github.com/${REPO}/blob/gh-pages/coverage/coverage-badge.svg|g;
      #       s|https://github\.com/[^/]+/[^/]+/blob/gh-pages/coverage/coverage\.md|https://github.com/${REPO}/blob/gh-pages/coverage/coverage.md|g;
      #     " README.md

      # - name: Commit updated README
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"

      #     git add README.md

      #     git diff --cached --quiet && exit 0

      #     git commit -m "Update README coverage links"
      #     git push

      - name: Remove the .gitignore in htmlcov
        run: rm -f htmlcov/.gitignore

      - name: Move coverage output
        run: |
          mv coverage.md coverage-badge.svg htmlcov 

      - name: Deploy coverage to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/htmlcov
          publish_branch: gh-pages
          destination_dir: coverage
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
