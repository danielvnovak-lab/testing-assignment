name: test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Don't pile up superseded runs when changes land in quick succession
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: sync
        run: uv sync

      # GitHub runners ship with Chrome preinstalled; the web tests drive the
      # live playground site, so they must run headless.
      - name: test
        run: uv run pytest
        env:
          HEADLESS: "1"
